<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>ShoSVG</title>

    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #181818; background-image: none; }
    </style>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <button
        id="btnPaste"
        type="button"
        class="paste-btn"
        title="Click: paste the clipboard SVG as one merged shape layer.&#10;Alt/Option-click or Shift-click: paste as separate shape layers, one per element."
    >
        <span class="paste-btn__icons" aria-hidden="true">

            <svg class="icon icon--wordmark" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path
                    d="M21 8h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2v-4h-1M7 8H4a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h2a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H3m7-8l1.5 8h1L14 8"
                    fill="none"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>

            <svg class="icon icon--paste" viewBox="0 0 512 512" focusable="false" aria-hidden="true">
                <path
                    class="icon__board"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M104.6 48H64C28.7 48 0 76.7 0 112v272c0 35.3 28.7 64 64 64h96v-48H64c-8.8 0-16-7.2-16-16V112c0-8.8 7.2-16 16-16h16c0 17.7 14.3 32 32 32h72.4c17.6-19.6 43.2-32 71.6-32h62c-7.1-27.6-32.2-48-62-48h-40.6C211.6 20.9 188.2 0 160 0s-51.6 20.9-55.4 48zm39.4 8a16 16 0 1 1 32 0a16 16 0 1 1-32 0z"
                />
                <path
                    class="icon__paper"
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M448 464H256c-8.8 0-16-7.2-16-16V192c0-8.8 7.2-16 16-16h140.1l67.9 67.9V448c0 8.8-7.2 16-16 16zm-192 48h192c35.3 0 64-28.7 64-64V243.9c0-12.7-5.1-24.9-14.1-33.9L430 142.1c-9-9-21.2-14.1-33.9-14.1H256c-35.3 0-64 28.7-64 64v256c0 35.3 28.7 64 64 64z"
                />
            </svg>

        </span>

        <span class="paste-btn__credit" aria-hidden="true">sho</span>
    </button>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
